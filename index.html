<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイカツ！カードリスト</title>
    <style>
        /* 🎨 CSS：全体のデザイン */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5; /* 淡いピンクの背景 */
            color: #333;
            margin: 0;
            padding: 20px 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ff4081; /* アイカツ風ピンク */
            margin-bottom: 10px;
        }
        
        .counter {
            font-size: 1.2rem;
            background-color: white;
            display: inline-block;
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            font-weight: bold;
        }

        #percentage {
            color: #ff4081;
            font-size: 1.5rem;
        }

        /* 🔎 検索ボックスエリア */
        .search-container {
            margin-bottom: 12px;
        }

        .search-input {
            width: 80%;
            max-width: 350px;
            padding: 8px 16px;
            font-size: 0.95rem;
            border: 2px solid #ff4081;
            border-radius: 20px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .search-input:focus {
            box-shadow: 0 0 8px rgba(255, 64, 129, 0.4);
        }

        /* 🔘 ボタンエリア */
        .action-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            background-color: white;
            color: #ff4081;
            border: 2px solid #ff4081;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .action-btn:hover, .action-btn.active {
            background-color: #ff4081;
            color: white;
        }

        /* 🏷️ 「表示」メニュー（アコーディオン） */
        .display-menu-wrapper {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .tab-container {
            display: none;
            background-color: white;
            border: 2px solid #ff4081;
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .tab-container.open {
            display: flex;
        }

        .tab-btn {
            background-color: #fff0f5;
            color: #ff4081;
            border: 1px solid #ff4081;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #ff4081;
            color: white;
        }

        .series-group-wrapper {
            display: block;
            width: 100%;
        }

        .series-group-wrapper.hidden {
            display: none !important;
        }

        .card-container {
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }

        .series-title {
            font-size: 1.3rem;
            color: #ff4081;
            border-left: 5px solid #ff4081;
            padding-left: 10px;
            margin-top: 30px;
            margin-bottom: 12px;
        }

        .card-group {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            width: 100%;
        }

        /* 🃏 パソコンでの基本カードサイズ */
        .card {
            width: 120px;
            height: 170px;
            background-color: #e0e0e0;
            border: 3px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            user-select: none;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        .card.hidden-search {
            display: none !important;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card.owned {
            opacity: 1;
            filter: grayscale(0%);
            border-color: #ff4081;
            box-shadow: 0 6px 12px rgba(255, 64, 129, 0.4);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rarity-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: rgba(255, 64, 129, 0.9);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 10;
        }

        /* 📱 スマホ用レスポンシブデザイン（768px以下・3列表示維持） */
        @media screen and (max-width: 768px) {
            .card-group {
                gap: 6px !important;
                justify-content: flex-start !important;
            }
            
            .card {
                width: calc((100% - 12px) / 3) !important;
                height: auto !important;
                aspect-ratio: 120 / 170 !important;
                border-width: 2px !important;
            }
        }
    </style>
</head>
<body>

    <h1>アイカツ！カードリスト</h1>
    
    <div class="counter">
        所持： <span id="owned-count">0</span> / <span id="total-count">0</span> 種 (<span id="percentage">0</span>%)
    </div>

    <!-- 🔎 検索入力エリア -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 カード名・ID・レア度で検索...">
    </div>

    <!-- 🔘 ボタンエリア -->
    <div class="action-container">
        <button id="toggle-menu-btn" class="action-btn">表示：すべて ▼</button>
        <button id="select-all-btn" class="action-btn">すべて所持にする</button>
    </div>

    <!-- 🏷️ 「表示」メニュー（タブ選択ドロップダウン） -->
    <div class="display-menu-wrapper">
        <div class="tab-container" id="tab-container"></div>
    </div>

    <div class="card-container" id="card-container"></div>

    <script>
        const container = document.getElementById("card-container");
        const tabContainer = document.getElementById("tab-container");
        const toggleMenuBtn = document.getElementById("toggle-menu-btn");
        const searchInput = document.getElementById("search-input");
        const ownedCountEl = document.getElementById("owned-count");
        const totalCountEl = document.getElementById("total-count");
        const percentageEl = document.getElementById("percentage");
        const selectAllBtn = document.getElementById("select-all-btn");
        
        let savedOwnedIds = JSON.parse(localStorage.getItem("myCardCollection")) || [];
        const seriesWrappers = [];

        // 「表示」ボタンでメニューの開閉を切替
        toggleMenuBtn.addEventListener("click", () => {
            tabContainer.classList.toggle("open");
        });

        fetch('cards.csv')
            .then(response => {
                if (!response.ok) throw new Error('エラー');
                return response.text();
            })
            .then(csvText => {
                let cleanText = csvText.replace(/^\ufeff/, '').trim();
                const lines = cleanText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length < 2) return;

                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                const cardData = [];

                for (let i = 1; i < lines.length; i++) {
                    const currentLine = lines[i].split(',').map(v => v.trim());
                    if (currentLine.length < headers.length) continue;

                    const obj = {};
                    headers.forEach((header, index) => { obj[header] = currentLine[index]; });
                    cardData.push(obj);
                }

                totalCountEl.textContent = cardData.length;

                let currentSeries = "";
                let currentGroupContainer = null;
                let currentWrapper = null;

                cardData.forEach(card => {
                    if (!card.series || !card.id) return;

                    if (card.series !== currentSeries) {
                        currentSeries = card.series;
                        
                        currentWrapper = document.createElement("div");
                        currentWrapper.classList.add("series-group-wrapper");
                        currentWrapper.setAttribute("data-series", currentSeries);
                        container.appendChild(currentWrapper);
                        seriesWrappers.push(currentWrapper);

                        const heading = document.createElement("h2");
                        heading.classList.add("series-title");
                        heading.textContent = currentSeries;
                        currentWrapper.appendChild(heading);

                        currentGroupContainer = document.createElement("div");
                        currentGroupContainer.classList.add("card-group");
                        currentWrapper.appendChild(currentGroupContainer);
                    }

                    const cardEl = document.createElement("div");
                    cardEl.classList.add("card");
                    cardEl.setAttribute("data-id", card.id);
                    cardEl.setAttribute("data-name", card.name || "");
                    cardEl.setAttribute("data-rarity", card.rarity || "");

                    if (savedOwnedIds.includes(card.id)) {
                        cardEl.classList.add("owned");
                    }

                    cardEl.innerHTML = `
                        <span class="rarity-badge">${card.rarity || 'N'}</span>
                        <img src="${card.image}" alt="${card.name}" class="card-img" title="${card.name}">
                    `;

                    cardEl.addEventListener("click", () => {
                        cardEl.classList.toggle("owned");
                        saveData();
                        styleUpdate(cardData.length);
                        updateSelectAllButtonText();
                    });

                    currentGroupContainer.appendChild(cardEl);
                });

                createTabs();
                styleUpdate(cardData.length);
                updateSelectAllButtonText();
            });

        // 🔎 リアルタイム検索の処理
        searchInput.addEventListener("input", (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll(".card");

            cards.forEach(card => {
                const id = card.getAttribute("data-id").toLowerCase();
                const name = card.getAttribute("data-name").toLowerCase();
                const rarity = card.getAttribute("data-rarity").toLowerCase();

                if (id.includes(keyword) || name.includes(keyword) || rarity.includes(keyword)) {
                    card.classList.remove("hidden-search");
                } else {
                    card.classList.add("hidden-search");
                }
            });

            // 検索結果がないシリーズの見出しを非表示にする
            seriesWrappers.forEach(wrapper => {
                const visibleCards = wrapper.querySelectorAll(".card:not(.hidden-search)");
                if (visibleCards.length === 0) {
                    wrapper.classList.add("hidden");
                } else {
                    wrapper.classList.remove("hidden");
                }
            });
        });

        // 🏷️ タブ生成関数
        function createTabs() {
            tabContainer.innerHTML = "";

            const allBtn = document.createElement("button");
            allBtn.classList.add("tab-btn", "active");
            allBtn.textContent = "すべて";
            allBtn.addEventListener("click", () => switchTab("すべて", allBtn));
            tabContainer.appendChild(allBtn);

            seriesWrappers.forEach(wrapper => {
                const name = wrapper.getAttribute("data-series");
                const btn = document.createElement("button");
                btn.classList.add("tab-btn");
                btn.textContent = name;
                btn.addEventListener("click", () => switchTab(name, btn));
                tabContainer.appendChild(btn);
            });
        }

        // 🔀 タブ切り替え処理
        function switchTab(selected, clickedBtn) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            clickedBtn.classList.add("active");

            toggleMenuBtn.textContent = `表示：${selected} ▼`;
            searchInput.value = ""; // タブ変更時は検索をクリア

            document.querySelectorAll(".card").forEach(c => c.classList.remove("hidden-search"));

            seriesWrappers.forEach(wrapper => {
                if (selected === "すべて" || wrapper.getAttribute("data-series") === selected) {
                    wrapper.classList.remove("hidden");
                } else {
                    wrapper.classList.add("hidden");
                }
            });

            tabContainer.classList.remove("open");
        }

        selectAllBtn.addEventListener("click", () => {
            const allCards = document.querySelectorAll(".card");
            const totalCards = allCards.length;
            const ownedCards = document.querySelectorAll(".card.owned").length;

            const shouldBeOwned = ownedCards < totalCards;

            allCards.forEach(card => {
                if (shouldBeOwned) {
                    card.classList.add("owned");
                } else {
                    card.classList.remove("owned");
                }
            });

            saveData();
            styleUpdate(totalCards);
            updateSelectAllButtonText();
        });

        function updateSelectAllButtonText() {
            const totalCards = document.querySelectorAll(".card").length;
            const ownedCards = document.querySelectorAll(".card.owned").length;
            if (ownedCards === totalCards && totalCards > 0) {
                selectAllBtn.textContent = "すべて未所持に戻す";
            } else {
                selectAllBtn.textContent = "すべて所持にする";
            }
        }

        function saveData() {
            const owned = [];
            document.querySelectorAll(".card.owned").forEach(card => {
                owned.push(card.getAttribute("data-id"));
            });
            localStorage.setItem("myCardCollection", JSON.stringify(owned));
        }

        function styleUpdate(total) {
            const ownedCount = document.querySelectorAll(".card.owned").length;
            ownedCountEl.textContent = ownedCount;
            percentageEl.textContent = Math.round((ownedCount / total) * 100) || 0;
        }
    </script>
</body>
</html>
