<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイカツ！カードリスト</title>
    <style>
        /* 🎨 CSS：全体のデザイン */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #fff0f5; /* 淡いピンクの背景 */
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ff4081; /* アイカツ風ピンク */
            margin-bottom: 10px;
        }
        
        .counter {
            font-size: 1.3rem;
            background-color: white;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            font-weight: bold;
        }

        #percentage {
            color: #ff4081;
            font-size: 1.6rem;
        }

        /* 🏷️ タブボタンエリア */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: white;
            color: #ff4081;
            border: 2px solid #ff4081;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #ff4081;
            color: white;
        }

        .series-group-wrapper {
            display: block;
            width: 100%;
        }

        .series-group-wrapper.hidden {
            display: none;
        }

        .card-container {
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }

        .series-title {
            font-size: 1.4rem;
            color: #ff4081;
            border-left: 5px solid #ff4081;
            padding-left: 10px;
            margin-top: 40px;
            margin-bottom: 15px;
        }

        .card-group {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            width: 100%;
        }

        /* 🃏 パソコンでのカードのサイズ */
        .card {
            width: 120px;
            height: 170px;
            background-color: #e0e0e0;
            border: 3px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            user-select: none;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: all 0.2s ease-in-out;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card.owned {
            opacity: 1;
            filter: grayscale(0%);
            border-color: #ff4081;
            box-shadow: 0 6px 12px rgba(255, 64, 129, 0.4);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rarity-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: rgba(255, 64, 129, 0.9);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 10;
        }

        /* 📱 スマホ画面（画面幅が600pxより小さい時）の完璧な3列表示 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .tab-container {
                gap: 6px;
                margin-bottom: 15px;
            }
            .tab-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .series-title {
                font-size: 1.1rem;
                margin-top: 20px;
                margin-bottom: 10px;
            }
            .card-group {
                gap: 8px; /* カード同士のすき間を8pxにする */
            }
            .card {
                /* 画面全体の幅からすき間を引いて、ぴったり3等分（3列）にする計算 */
                width: calc((100% - 16px) / 3);
                height: auto;
                aspect-ratio: 120 / 170; /* 縦横の綺麗さを保つ */
                border-width: 2px;
            }
        }
    </style>
</head>
<body>

    <h1>✨ アイカツ！カードリスト ✨</h1>
    
    <div class="counter">
        所所持： <span id="owned-count">0</span> / <span id="total-count">0</span> 種 (<span id="percentage">0</span>%)
    </div>

    <!-- タブボタンが自動生成される場所 -->
    <div class="tab-container" id="tab-container"></div>

    <div class="card-container" id="card-container"></div>

    <script>
        const container = document.getElementById("card-container");
        const tabContainer = document.getElementById("tab-container");
        const ownedCountEl = document.getElementById("owned-count");
        const totalCountEl = document.getElementById("total-count");
        const percentageEl = document.getElementById("percentage");
        const savedOwnedIds = JSON.parse(localStorage.getItem("myCardCollection")) || [];
        const seriesWrappers = [];

        // 📥 cards.csv ファイルを読み込む命令
        fetch('cards.csv')
            .then(response => {
                if (!response.ok) throw new Error('エラー');
                return response.text();
            })
            .then(csvText => {
                // BOM（ゴミ文字）を除去し、改行ごとに分割する最新の安全な書き方
                let cleanText = csvText.replace(/^\ufeff/, '').trim();
                const lines = cleanText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length < 2) return;

                // 1行目の見出しを取得
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                const cardData = [];

                // 2行目以降のカードデータを整理する
                for (let i = 1; i < lines.length; i++) {
                    const currentLine = lines[i].split(',').map(v => v.trim());
                    if (currentLine.length < headers.length) continue;

                    const obj = {};
                    headers.forEach((header, index) => {
                        obj[header] = currentLine[index];
                    });
                    cardData.push(obj);
                }

                totalCountEl.textContent = cardData.length;

                let currentSeries = "";
                let currentGroupContainer = null;
                let currentWrapper = null;

                // 画面にカードと見出しを並べる
                cardData.forEach(card => {
                    if (!card.series || !card.id) return;

                    if (card.series !== currentSeries) {
                        currentSeries = card.series;
                        
                        currentWrapper = document.createElement("div");
                        currentWrapper.classList.add("series-group-wrapper");
                        currentWrapper.setAttribute("data-series", currentSeries);
                        container.appendChild(currentWrapper);
                        seriesWrappers.push(currentWrapper);

                        const heading = document.createElement("h2");
                        heading.classList.add("series-title");
                        heading.textContent = currentSeries;
                        currentWrapper.appendChild(heading);

                        currentGroupContainer = document.createElement("div");
                        currentGroupContainer.classList.add("card-group");
                        currentWrapper.appendChild(currentGroupContainer);
                    }

                    const cardEl = document.createElement("div");
                    cardEl.classList.add("card");
                    cardEl.setAttribute("data-id", card.id);

                    if (savedOwnedIds.includes(card.id)) {
                        cardEl.classList.add("owned");
                    }

                    cardEl.innerHTML = `
                        <span class="rarity-badge">${card.rarity || 'N'}</span>
                        <img src="${card.image}" alt="${card.name}" class="card-img" title="${card.name}">
                    `;

                    cardEl.addEventListener("click", () => {
                        cardEl.classList.toggle("owned");
                        saveData();
                        styleUpdate(cardData.length);
                    });

                    currentGroupContainer.appendChild(cardEl);
                });

                createTabs();
                styleUpdate(cardData.length);
            });

        // 🔘 タブボタンを自動作成する関数
        function createTabs() {
            const seriesList = seriesWrappers.map(w => w.getAttribute("data-series"));
            const allBtn = document.createElement("button");
            allBtn.classList.add("tab-btn", "active");
            allBtn.textContent = "すべて";
            allBtn.addEventListener("click", () => switchTab("すべて", allBtn));
            tabContainer.appendChild(allBtn);

            seriesList.forEach(name => {
                const btn = document.createElement("button");
                btn.classList.add("tab-btn");
                btn.textContent = name;
                btn.addEventListener("click", () => switchTab(name, btn));
                tabContainer.appendChild(btn);
            });
        }

        // 🔄 タブ表示を切り替える関数
        function switchTab(selected, clickedBtn) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            clickedBtn.classList.add("active");

            seriesWrappers.forEach(wrapper => {
                if (selected === "すべて" || wrapper.getAttribute("data-series") === selected) {
                    wrapper.classList.remove("hidden");
                } else {
wrapper.classList.add("hidden");
}
});
}
// 📤 セーブ保存する関数
function saveData() {
const owned = [];
document.querySelectorAll(".card.owned").forEach(card => {
owned.push(card.getAttribute("data-id"));
});
localStorage.setItem("myCardCollection", JSON.stringify(owned));
}
// 🧮 パーセンテージを計算する関数
function styleUpdate(total) {
const ownedCount = document.querySelectorAll(".card.owned").length;
ownedCountEl.textContent = ownedCount;
percentageEl.textContent = Math.round((ownedCount / total) * 100) || 0;
}

    </script>
</body>
</html>
